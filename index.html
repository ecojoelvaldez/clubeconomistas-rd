<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Economistas — Infraestructura de datos económicos reproducibles</title>
<meta name="description" content="Series económicas dominicanas limpias, citables y reproducibles. Investigación con datos y código abiertos." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.min.js"></script>
<style>
  :root {
    --azul: #1E2A38;
    --azul-90: #2A3A4D;
    --azul-70: #4A5A6E;
    --azul-50: #6E7C8C;
    --azul-30: #A6AFBA;
    --azul-12: rgba(30,42,56,0.12);
    --azul-08: rgba(30,42,56,0.08);
    --azul-04: rgba(30,42,56,0.04);
    --oro: #C9A44D;
    --oro-claro: #DBBE7A;
    --oro-oscuro: #A8873A;
    --oro-12: rgba(201,164,77,0.12);
    --oro-20: rgba(201,164,77,0.20);
    --verde: #15795F;
    --verde-12: rgba(21,121,95,0.10);
    --rojo: #B23A3A;
    --rojo-12: rgba(178,58,58,0.10);
    --blanco: #FFFFFF;
    --niebla: #F6F7F8;
    --niebla-2: #EDEFF2;
    --linea: rgba(30,42,56,0.10);
    --linea-fuerte: rgba(30,42,56,0.18);
    --tinta: #16202B;
    --display: 'Fraunces', Georgia, serif;
    --texto: 'Newsreader', Georgia, serif;
    --ui: 'Geist', system-ui, sans-serif;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --z-sticky: 100; --z-dropdown: 200; --z-backdrop: 300; --z-modal: 400; --z-toast: 500;
    --maxw: 1240px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--ui); color: var(--azul); background: var(--niebla);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    line-height: 1.55; overflow-x: hidden;
  }
  ::selection { background: var(--azul); color: var(--oro-claro); }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--ui); cursor: pointer; border: none; background: none; color: inherit; }
  ul { list-style: none; }
  img, svg { display: block; }
  h1,h2,h3,h4 { font-family: var(--display); font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; color: var(--azul); text-wrap: balance; }
  p { text-wrap: pretty; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px){ .wrap { padding: 0 20px; } }

  /* ENTRADA */
  .rise { opacity: 0; transform: translateY(14px); }
  .rise.in { animation: rise 720ms var(--ease-out) forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .stagger > * { opacity: 0; transform: translateY(12px); }
  .stagger.in > * { animation: rise 600ms var(--ease-out) forwards; }
  .stagger.in > *:nth-child(1){animation-delay:0ms;} .stagger.in > *:nth-child(2){animation-delay:55ms;}
  .stagger.in > *:nth-child(3){animation-delay:110ms;} .stagger.in > *:nth-child(4){animation-delay:165ms;}
  .stagger.in > *:nth-child(5){animation-delay:220ms;} .stagger.in > *:nth-child(6){animation-delay:275ms;}

  /* NAV */
  .nav { position: sticky; top: 0; z-index: var(--z-sticky);
    background: rgba(246,247,248,0.82); backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid transparent; transition: border-color 220ms ease, background 220ms ease; }
  .nav.scrolled { border-bottom-color: var(--linea); background: rgba(246,247,248,0.94); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 74px; }
  .nav-logo { display: flex; align-items: center; gap: 12px; }
  .nav-logo img { height: 34px; width: auto; }
  .nav-logo .wordmark { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: var(--azul); }
  .nav-logo .wordmark span { color: var(--oro-oscuro); }
  .nav-links { display: flex; align-items: center; gap: 2px; }
  .nav-link { font-size: 14px; font-weight: 500; color: var(--azul-70); padding: 9px 14px; border-radius: 9px; position: relative; transition: color 180ms ease, background 180ms ease; }
  .nav-link:hover { color: var(--azul); background: var(--azul-04); }
  .nav-link.active { color: var(--azul); }
  .nav-link.active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 3px; height: 2px; background: var(--oro); border-radius: 2px; transform-origin: left; animation: lineIn 280ms var(--ease-out) forwards; }
  @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .nav-cta { font-size: 13.5px; font-weight: 600; color: var(--azul); border: 1px solid var(--linea-fuerte); padding: 9px 16px; border-radius: 10px; transition: border-color 180ms ease, transform 120ms var(--ease-out), background 180ms ease; }
  .nav-cta:hover { border-color: var(--azul); background: var(--blanco); }
  .nav-cta:active { transform: scale(0.97); }
  .nav-burger { display: none; }
  @media (max-width: 920px){ .nav-links { display: none; } .nav-cta { display: none; }
    .nav-burger { display: flex; flex-direction: column; gap: 5px; padding: 10px; position: relative; z-index: calc(var(--z-modal) + 1); }
    .nav-burger span { width: 22px; height: 2px; background: var(--azul); border-radius: 2px; transition: transform 320ms var(--ease-out), opacity 200ms ease; transform-origin: center; }
    .nav-burger.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
    .nav-burger.open span:nth-child(2){ opacity: 0; }
    .nav-burger.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); } }

  /* ===== DRAWER MÓVIL ===== */
  .drawer-backdrop { position: fixed; inset: 0; z-index: var(--z-backdrop); background: rgba(22,32,43,0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity 320ms ease, visibility 320ms ease; }
  .drawer-backdrop.open { opacity: 1; visibility: visible; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-modal); width: min(86vw, 380px); background: var(--niebla); box-shadow: -18px 0 50px -24px rgba(30,42,56,0.5); transform: translateX(100%); transition: transform 420ms var(--ease-drawer); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 11px; padding: 22px 22px 18px; border-bottom: 1px solid var(--linea); position: sticky; top: 0; background: var(--niebla); }
  .drawer-head img { height: 30px; width: auto; }
  .drawer-head .wordmark { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--azul); }
  .drawer-head .wordmark span { color: var(--oro-oscuro); }
  .drawer-nav { padding: 10px 0; flex: 1; }
  .drawer-item { border-bottom: 1px solid var(--linea); }
  .drawer-link { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 16px 22px; font-family: var(--ui); font-size: 16px; font-weight: 600; color: var(--azul); transition: background 160ms ease; }
  .drawer-link:hover, .drawer-link:active { background: var(--azul-04); }
  .drawer-link.active { color: var(--oro-oscuro); }
  .drawer-link .chev { transition: transform 340ms var(--ease-out); flex-shrink: 0; }
  .drawer-link.expanded .chev { transform: rotate(180deg); }
  .drawer-sub-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 360ms var(--ease-drawer); }
  .drawer-sub-wrap.open { grid-template-rows: 1fr; }
  .drawer-sub { overflow: hidden; }
  .drawer-sub button { display: block; width: 100%; text-align: left; padding: 12px 22px 12px 38px; font-family: var(--ui); font-size: 14px; font-weight: 500; color: var(--azul-70); transition: background 150ms ease, color 150ms ease; }
  .drawer-sub button:hover, .drawer-sub button.on { color: var(--azul); background: var(--azul-04); }
  .drawer-sub button.on { color: var(--oro-oscuro); }
  .drawer-admin { color: var(--oro-oscuro) !important; }
  .drawer-foot { padding: 22px; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 14px; }
  .drawer-foot .member-cta { text-align: center; padding: 13px 14px; font-size: 12px; }
  .drawer-social { display: flex; gap: 10px; justify-content: center; }
  .drawer-social a { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--oro-20); color: var(--oro-oscuro); font-size: 13px; font-weight: 800; }
  .drawer-social a:active { background: var(--oro-12); }
  body.drawer-locked { overflow: hidden; }
  @media (min-width: 921px){ .drawer, .drawer-backdrop { display: none; } }

  /* HERO */
  .hero { position: relative; padding: 80px 0 56px; overflow: hidden; }
  .hero-grid { display: grid; grid-template-columns: 1.12fr 0.88fr; gap: 56px; align-items: center; }
  @media (max-width: 980px){ .hero-grid { grid-template-columns: 1fr; gap: 40px; } }
  .hero-eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--azul-70); text-transform: uppercase; margin-bottom: 24px; }
  .hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--oro); box-shadow: 0 0 0 4px var(--oro-20); }
  .hero h1 { font-size: clamp(2.5rem, 5.6vw, 4.2rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.02; }
  .hero h1 .it { font-style: italic; font-weight: 400; color: var(--azul-90); }
  .hero h1 .gold { color: var(--oro-oscuro); }
  .hero-sub { font-family: var(--texto); font-size: clamp(1.05rem, 1.8vw, 1.24rem); line-height: 1.6; color: var(--azul-70); max-width: 54ch; margin-top: 24px; }
  .hero-actions { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; }
  .btn { font-size: 15px; font-weight: 600; padding: 14px 26px; border-radius: 12px; transition: transform 120ms var(--ease-out), box-shadow 220ms var(--ease-out), background 200ms ease, border-color 180ms ease; display: inline-flex; align-items: center; gap: 9px; }
  .btn:active { transform: scale(0.975); }
  .btn-primary { background: var(--azul); color: var(--niebla); box-shadow: 0 1px 2px rgba(30,42,56,0.2); }
  .btn-primary:hover { background: var(--tinta); box-shadow: 0 8px 24px -8px rgba(30,42,56,0.45); }
  .btn-primary .arr { transition: transform 220ms var(--ease-out); }
  .btn-primary:hover .arr { transform: translateX(4px); }
  .btn-ghost { color: var(--azul); border: 1px solid var(--linea-fuerte); }
  .btn-ghost:hover { border-color: var(--azul); background: var(--blanco); }
  .hero-emblem { display: flex; justify-content: center; align-items: center; }
  .hero-emblem img { width: min(360px, 78%); height: auto; filter: drop-shadow(0 18px 40px rgba(30,42,56,0.22)); animation: floatY 6s ease-in-out infinite; }
  @keyframes floatY { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-10px);} }
  .sources { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--linea); display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
  .sources .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--azul-50); }
  .sources .src { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--azul-70); letter-spacing: -0.01em; transition: color 180ms ease; }
  .sources .src:hover { color: var(--azul); }
  .hero-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .hero-bg::before { content: ""; position: absolute; top: -40%; right: -8%; width: 56vw; height: 56vw; background: radial-gradient(circle at center, var(--oro-12), transparent 62%); }
  .hero-bg .lines { position: absolute; inset: 0; opacity: 0.5; background-image: linear-gradient(var(--azul-04) 1px, transparent 1px); background-size: 100% 76px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }

  /* SECCIÓN GENÉRICA */
  .section-pad { padding: 80px 0; }
  .section-pad.alt { background: var(--blanco); }
  .section-kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--oro-oscuro); margin-bottom: 14px; display: block; }

  /* ===== PANEL COLAPSABLE (click to expand) ===== */
  .panel { border: 1px solid var(--linea); border-radius: 18px; background: var(--blanco); overflow: hidden; transition: box-shadow 280ms var(--ease-out), border-color 220ms ease; }
  .panel.open { box-shadow: 0 18px 50px -24px rgba(30,42,56,0.32); border-color: var(--linea-fuerte); }
  .panel-head { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 30px 34px; width: 100%; text-align: left; transition: background 200ms ease; }
  .panel-head:hover { background: var(--azul-04); }
  @media (max-width: 640px){ .panel-head { padding: 24px 20px; gap: 16px; } }
  .panel-num { font-family: var(--display); font-style: italic; font-size: 1.5rem; font-weight: 500; color: var(--oro-oscuro); width: 38px; }
  .panel-titles h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 600; letter-spacing: -0.025em; }
  .panel-titles p { font-family: var(--texto); font-size: 1.04rem; color: var(--azul-70); margin-top: 8px; line-height: 1.55; max-width: 62ch; }
  .panel-toggle { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--linea-fuerte); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 200ms ease, border-color 200ms ease, transform 360ms var(--ease-out); }
  .panel.open .panel-toggle { background: var(--azul); border-color: var(--azul); transform: rotate(180deg); }
  .panel-toggle svg { transition: stroke 200ms ease; }
  .panel.open .panel-toggle svg { stroke: var(--niebla); }
  .panel-body-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 420ms var(--ease-drawer); }
  .panel.open .panel-body-wrap { grid-template-rows: 1fr; }
  .panel-body { overflow: hidden; }
  .panel-body-inner { padding: 8px 34px 34px; border-top: 1px solid var(--linea); }
  @media (max-width: 640px){ .panel-body-inner { padding: 8px 20px 24px; } }
  .panels-stack { display: flex; flex-direction: column; gap: 18px; }

  /* ESTADÍSTICAS */
  .stats-layout { display: grid; grid-template-columns: 290px 1fr; gap: 0; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; margin-top: 8px; }
  @media (max-width: 880px){ .stats-layout { grid-template-columns: 1fr; } }
  .series-list { border-right: 1px solid var(--linea); background: var(--niebla); }
  @media (max-width: 880px){ .series-list { border-right: none; border-bottom: 1px solid var(--linea); display: flex; overflow-x: auto; } }
  .series-item { width: 100%; text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--linea); transition: background 160ms ease; position: relative; display: block; }
  @media (max-width: 880px){ .series-item { white-space: nowrap; border-bottom: none; border-right: 1px solid var(--linea); min-width: 190px; } }
  .series-item:last-child { border-bottom: none; }
  .series-item:hover { background: var(--azul-04); }
  .series-item.sel { background: var(--blanco); }
  .series-item.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--oro); }
  .series-item .code { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; color: var(--azul-50); font-variant-numeric: tabular-nums; }
  .series-item .t { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--azul); margin-top: 3px; letter-spacing: -0.01em; }
  .series-item .m { font-size: 11.5px; color: var(--azul-50); margin-top: 4px; }
  .series-detail { padding: 28px 30px; min-width: 0; background: var(--blanco); }
  .series-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .series-detail h3 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
  .series-detail .sub { font-size: 13px; color: var(--azul-50); margin-top: 6px; }
  .badge-id { font-size: 11.5px; font-weight: 600; color: var(--oro-oscuro); background: var(--oro-12); padding: 5px 11px; border-radius: 8px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .kpis { display: flex; gap: 30px; margin: 22px 0 6px; flex-wrap: wrap; }
  .kpi .v { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.02em; color: var(--azul); font-variant-numeric: tabular-nums; }
  .kpi .v.up { color: var(--verde); } .kpi .v.down { color: var(--rojo); }
  .kpi .k { font-size: 11.5px; font-weight: 500; color: var(--azul-50); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .chart-box { height: 260px; margin-top: 16px; }
  .series-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; font-weight: 500; color: var(--azul-70); border: 1px solid var(--linea); padding: 8px 14px; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; transition: border-color 160ms ease, color 160ms ease, background 160ms ease, transform 120ms var(--ease-out); }
  .chip:hover { border-color: var(--azul-30); color: var(--azul); background: var(--niebla); }
  .chip:active { transform: scale(0.97); }

  /* INVESTIGACIÓN */
  .research-list { display: flex; flex-direction: column; border-top: 1px solid var(--linea); margin-top: 8px; }
  .research-row { display: grid; grid-template-columns: 78px 1fr auto; gap: 26px; align-items: center; padding: 24px 8px; border-bottom: 1px solid var(--linea); transition: background 200ms ease, padding-left 220ms var(--ease-out); }
  @media (max-width: 720px){ .research-row { grid-template-columns: 1fr; gap: 10px; padding: 20px 4px; } }
  .research-row:hover { background: var(--azul-04); padding-left: 16px; }
  .research-year { font-family: var(--display); font-size: 1.2rem; font-weight: 500; color: var(--oro-oscuro); font-style: italic; }
  .research-main h4 { font-size: 1.22rem; font-weight: 600; letter-spacing: -0.02em; transition: color 180ms ease; }
  .research-row:hover .research-main h4 { color: var(--tinta); }
  .research-main .authors { font-size: 13px; color: var(--azul-50); margin-top: 5px; }
  .research-tags { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; color: var(--azul-70); background: var(--azul-08); padding: 4px 10px; border-radius: 6px; }
  .tag.repro { color: var(--verde); background: var(--verde-12); }
  .research-cta { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--azul-70); transition: color 180ms ease; white-space: nowrap; }
  .research-row:hover .research-cta { color: var(--azul); }
  .research-cta .arr { transition: transform 220ms var(--ease-out); }
  .research-row:hover .research-cta .arr { transform: translateX(3px); }
  .submit-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; padding: 18px 20px; background: var(--niebla); border-radius: 12px; flex-wrap: wrap; }
  .submit-row p { font-size: 14px; color: var(--azul-70); }
  .submit-row p b { color: var(--azul); font-weight: 600; }

  /* PANEL ADMIN */
  .admin-tabs { display: flex; gap: 4px; margin-top: 8px; padding: 4px; background: var(--niebla); border-radius: 11px; width: fit-content; }
  .admin-tab { font-size: 13px; font-weight: 600; color: var(--azul-50); padding: 8px 16px; border-radius: 8px; transition: color 180ms ease, background 180ms ease; }
  .admin-tab.on { color: var(--azul); background: var(--blanco); box-shadow: 0 1px 3px rgba(30,42,56,0.1); }
  .admin-tab .count { font-size: 11px; margin-left: 6px; padding: 1px 7px; border-radius: 20px; background: var(--azul-08); color: var(--azul-70); font-variant-numeric: tabular-nums; }
  .admin-tab.on .count { background: var(--oro-12); color: var(--oro-oscuro); }
  .queue { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .queue-card { border: 1px solid var(--linea); border-radius: 14px; padding: 22px 24px; background: var(--blanco); transition: opacity 360ms var(--ease-out), transform 360ms var(--ease-out), border-color 200ms ease; }

  .section-dropdown-row select, .job-form input { width: 100%; border: 1px solid var(--linea-fuerte); background: var(--blanco); color: var(--azul); border-radius: 10px; padding: 11px 13px; font-family: var(--ui); font-size: 13.5px; }
  .section-dropdown-row p { font-family: var(--texto); color: var(--azul-70); font-size: 14px; }
  .subview-banner { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 18px 20px; background: linear-gradient(135deg, var(--niebla), var(--blanco)); border: 1px solid var(--linea); border-radius: 15px; margin-bottom: 22px; }
  .subview-banner span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--oro-oscuro); }
  .subview-banner h3 { font-size: 1.25rem; margin-top: 2px; }
  .subview-banner p { font-family: var(--texto); color: var(--azul-70); font-size: 14px; max-width: 56ch; }
  .institution-strip { display: flex; flex-wrap: wrap; gap: 10px; margin: -4px 0 20px; }
  .institution-pill { border: 1px solid var(--linea); background: var(--blanco); color: var(--azul-70); border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 700; }
  .institution-pill:hover, .institution-pill.on { border-color: var(--oro); color: var(--azul); background: var(--oro-12); }

  .discussion-grid, .job-grid, .mock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .discussion-card, .job-card, .mock-grid article, .policy-card { background: var(--blanco); border: 1px solid var(--linea); border-radius: 15px; padding: 22px; box-shadow: 0 12px 32px -28px rgba(30,42,56,.35); }
  .discussion-card span, .job-card span, .mock-grid article span { color: var(--oro-oscuro); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .discussion-card h3, .mock-grid article h3, .policy-card h3 { margin: 8px 0 10px; font-size: 1.18rem; }
  .discussion-card p, .mock-grid article p, .policy-card p, .job-card p { color: var(--azul-70); font-family: var(--texto); line-height: 1.55; }
  .jobs-panel { border: 1px solid var(--linea); border-radius: 16px; padding: 22px; background: var(--blanco); }
  .jobs-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom: 12px; }
  .jobs-head h3 { font-size: 1.5rem; }
  .job-contact { color: var(--azul-70); margin-bottom: 16px; font-size: 13.5px; }
  .job-form { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; padding: 14px; background: var(--niebla); border-radius: 13px; margin-bottom: 16px; }
  .job-card h4 { font-family: var(--display); margin: 8px 0 6px; font-size: 1.08rem; }
  .job-card div { margin-top: 12px; color: var(--azul-50); font-size: 12px; }

  @media (max-width: 920px){ .nav-links-premium { display:none; } .nav-right-actions { display:none; } }
  @media (max-width: 720px){ .section-dropdown-row { grid-template-columns: 1fr; } .job-form { grid-template-columns: 1fr; } .member-cta { padding: 9px 10px; font-size: 10.5px; } .social-link { display:none; } }

</style>

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.14, rootMargin: "0px 0px -6% 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}
function Reveal({ children, className = "", as: Tag = "div" }) {
  const ref = useReveal();
  return <Tag ref={ref} className={`rise ${className}`}>{children}</Tag>;
}

// Mapeo institución del UI -> valor "fuente" en el catálogo.
const SOURCE_MAP = {
  "BCRD": "BCRD",
  "SIMV": "SIMV",
  "DGII": "DGII",
  "Hacienda y Economía": "Hacienda y Economía",
  "BVRD": null,   // aún sin series en el master

};

// Downsample uniforme para series largas (Recharts no debe renderizar 100k+ puntos).
function downsample(arr, maxPoints) {
  if (arr.length <= maxPoints) return arr;
  const step = arr.length / maxPoints;
  const out = [];
  for (let i = 0; i < maxPoints; i++) out.push(arr[Math.floor(i * step)]);
  if (out[out.length - 1] !== arr[arr.length - 1]) out.push(arr[arr.length - 1]);
  return out;
}

function fmtNum(v) {
  if (v == null || isNaN(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(2) + " MM";
  if (a >= 1e6) return (v / 1e6).toFixed(2) + " M";
  if (a >= 1e3) return v.toLocaleString("es-DO", { maximumFractionDigits: 1 });
  return v.toLocaleString("es-DO", { maximumFractionDigits: 2 });
}

function StatsBody({ toast, initialInstitution = "BCRD", onSubChange }) {
  const institutions = ["BCRD", "SIMV", "DGII", "Hacienda y Economía", "BVRD", "FRED"];
  const [institution, setInstitution] = useState(initialInstitution);
  useEffect(() => setInstitution(initialInstitution), [initialInstitution]);

  const { Tooltip, ResponsiveContainer, CartesianGrid, XAxis, YAxis, Area, AreaChart } = RC;

  // Estado del master
  const [catalog, setCatalog] = useState([]);
  const [catalogError, setCatalogError] = useState(null);
  const [loadingCatalog, setLoadingCatalog] = useState(true);

  // Serie seleccionada + sus observaciones
  const [selectedId, setSelectedId] = useState(null);
  const [seriesPayload, setSeriesPayload] = useState(null);
  const [loadingSeries, setLoadingSeries] = useState(false);
  const [seriesError, setSeriesError] = useState(null);
  const [activeVar, setActiveVar] = useState(null);

  // 1) Cargar catálogo ligero una sola vez.
  useEffect(() => {
    let alive = true;
    setLoadingCatalog(true);
    fetch("data/series_catalog.json")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => { if (alive) { setCatalog(data); setLoadingCatalog(false); } })
      .catch(err => { if (alive) { setCatalogError(err.message); setLoadingCatalog(false); } });
    return () => { alive = false; };
  }, []);

  // Series destacadas que deben aparecer primero, por institución.
  const PINNED = {
    "BCRD": ["CE-SER-2026-0018", "CE-SER-2026-0032", "CE-SER-2026-0035"]
  };

  // Series visibles según institución activa, con las destacadas al frente.
  const sourceKey = SOURCE_MAP[institution];
  const visibleSeries = useMemo(() => {
    if (!sourceKey) return [];
    const all = catalog.filter(s => s.fuente === sourceKey);
    const pinned = PINNED[institution] || [];
    if (!pinned.length) return all;
    const order = new Map(pinned.map((id, i) => [id, i]));
    return all.slice().sort((a, b) => {
      const ai = order.has(a.id) ? order.get(a.id) : Infinity;
      const bi = order.has(b.id) ? order.get(b.id) : Infinity;
      if (ai !== bi) return ai - bi;
      return 0; // estable: el resto conserva su orden de catálogo
    });
  }, [catalog, sourceKey, institution]);

  // Auto-seleccionar la primera serie cuando cambia la institución.
  useEffect(() => {
    if (visibleSeries.length > 0) {
      setSelectedId(visibleSeries[0].id);
    } else {
      setSelectedId(null);
      setSeriesPayload(null);
    }
  }, [institution, visibleSeries.length]);

  // 2) Cargar observaciones de la serie seleccionada (bajo demanda).
  useEffect(() => {
    if (!selectedId) return;
    let alive = true;
    setLoadingSeries(true);
    setSeriesError(null);
    fetch("data/series/" + selectedId + ".json")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(data => {
        if (!alive) return;
        setSeriesPayload(data);
        const vars = data.meta?.variables || [];
        setActiveVar(vars.length ? vars[0] : null);
        setLoadingSeries(false);
      })
      .catch(err => { if (alive) { setSeriesError(err.message); setLoadingSeries(false); } });
    return () => { alive = false; };
  }, [selectedId]);

  const meta = seriesPayload?.meta || null;
  const variables = meta?.variables || [];

  // Lista real de variables presentes en las observaciones (no solo en meta).
  const obsVariables = useMemo(() => {
    if (!seriesPayload?.observations) return [];
    const set = new Set();
    for (const o of seriesPayload.observations) {
      if (o.variable != null) set.add(o.variable);
    }
    return Array.from(set);
  }, [seriesPayload]);

  // Variable efectiva: la activa si existe en esta serie; si no, la primera disponible.
  // Se resuelve aquí (no en un effect) para no depender del orden de setState.
  const effectiveVar = useMemo(() => {
    if (obsVariables.length === 0) return null;
    if (activeVar && obsVariables.includes(activeVar)) return activeVar;
    return obsVariables[0];
  }, [activeVar, obsVariables]);

  // Pivoteo: filtrar observaciones por la variable efectiva -> [{t, v}]
  const chartData = useMemo(() => {
    if (!seriesPayload?.observations) return [];
    const hasVarDim = obsVariables.length > 0;
    const obs = seriesPayload.observations
      .filter(o => (!hasVarDim ? true : o.variable === effectiveVar))
      .filter(o => o.value != null && !isNaN(+o.value))
      .map(o => ({ t: o.period || o.date, v: +o.value, _d: o.date }));
    obs.sort((a, b) => (a._d < b._d ? -1 : a._d > b._d ? 1 : 0));
    return downsample(obs, 220);
  }, [seriesPayload, effectiveVar, obsVariables.length]);

  // KPIs
  const last = chartData.length ? chartData[chartData.length - 1].v : null;
  const prev = chartData.length > 1 ? chartData[chartData.length - 2].v : null;
  const delta = (last != null && prev != null) ? last - prev : null;
  const dir = delta == null ? "" : delta > 0 ? "up" : delta < 0 ? "down" : "";
  const deltaPct = (delta != null && prev) ? (delta / Math.abs(prev)) * 100 : null;

  return (
    <div>
      <div className="subview-banner">
        <div><span>Institución activa</span><h3>{institution}</h3></div>
        <p>Catálogo conectado al master de datos del Club. {sourceKey
          ? `${visibleSeries.length} serie(s) disponibles para ${institution}.`
          : `Aún no hay series cargadas para ${institution} en esta versión.`}</p>
      </div>

      <div className="institution-strip">
        {institutions.map(i => (
          <button key={i} className={`institution-pill ${i === institution ? "on" : ""}`}
            onClick={() => { setInstitution(i); onSubChange && onSubChange(i); }}>{i}</button>
        ))}
      </div>

      {loadingCatalog && <div style={{ padding: "32px 0", color: "var(--azul-50)", fontSize: 13 }}>Cargando catálogo de series…</div>}

/* ============================== PANEL ADMIN ============================== */
function AdminBody({ toast, queue, setQueue, audit, setAudit }) {
  const [tab, setTab] = useState("cola");

  const resolve = (id, decision) => {
    setQueue(q => q.map(item => item.id===id ? {...item, status: decision} : item));
    const item = queue.find(i=>i.id===id);
    setAudit(a => [{ act: decision==="approved"?"a":"r", who:"J. Valdez", what: decision==="approved"?"aprobó":"rechazó", id, when:"Ahora" }, ...a]);
    toast(decision==="approved" ? "Aporte aprobado · publicado en el repositorio" : "Aporte rechazado · notificado al autor");
  };

  const pending = queue.filter(q=>q.status==="pending").length;

  return (
    <div>
      <div className="admin-tabs">
        <button className={`admin-tab ${tab==="cola"?"on":""}`} onClick={()=>setTab("cola")}>Cola de aprobación <span className="count">{pending}</span></button>
        <button className={`admin-tab ${tab==="audit"?"on":""}`} onClick={()=>setTab("audit")}>Registro de auditoría</button>
      </div>

      {tab==="cola" && (
        <div className="queue">
          {queue.map(item => (
            <div key={item.id} className={`queue-card ${item.status!=="pending"?"resolved":""}`}>
              <div className="queue-card-head">
                <div>
                  <h4>{item.title}</h4>
                  <div className="qmeta">{item.author} · {item.id} · {item.date}</div>
                  <div className="queue-kind">{item.type === "blog" ? "Blog / comentario" : item.type === "research" ? "Investigación formal" : "Aporte técnico"}</div>
                </div>
                <span className={`queue-status ${item.status}`}>
                  {item.status==="pending"?"Pendiente":item.status==="approved"?"Aprobado":"Rechazado"}
                </span>
              </div>
              <div className="queue-criteria">
                <span className="crit"><span className={`mk ${item.crit.data?"yes":"no"}`}>{item.crit.data?Ico.check():Ico.x()}</span> Datos adjuntos</span>
                <span className="crit"><span className={`mk ${item.crit.code?"yes":"no"}`}>{item.crit.code?Ico.check():Ico.x()}</span> Código reproducible</span>
                <span className="crit"><span className={`mk ${item.crit.scope?"yes":"no"}`}>{item.crit.scope?Ico.check():Ico.x()}</span> Dentro del alcance</span>
              </div>
              {(item.excerpt || item.series || item.chart || item.sector || item.dataNotes) && (
                <div className="draft-preview">
                  {item.sector && <div className="research-tags" style={{marginBottom:10}}><span className="tag">{item.sector}</span></div>}
                  {item.series && <span className="badge-id">Dato vinculado: {item.series}</span>}
                  {item.chart && <div className="qmeta" style={{marginTop:8}}>Archivo adjunto: {item.chart}</div>}
                  {item.dataNotes && <div className="qmeta" style={{marginTop:8}}>Datos adicionales: {item.dataNotes.slice(0, 160)}{item.dataNotes.length>160?"…":""}</div>}
                  {item.excerpt && <p>{item.excerpt}</p>}
                </div>
              )}
              {item.status==="pending" && (
                <div className="queue-actions">
                  <button className="qbtn approve" onClick={()=>resolve(item.id,"approved")}>{Ico.check()} Aprobar</button>
                  <button className="qbtn reject" onClick={()=>resolve(item.id,"rejected")}>{Ico.x()} Rechazar</button>
                </div>
              )}
            </div>
          ))}
          <p className="admin-note">La curaduría evalúa criterio objetivo: reproducibilidad y pertinencia, no afinidad con el autor. La opinión sin datos queda fuera del alcance del repositorio.</p>
        </div>
      )}

      {tab==="audit" && (
        <div className="audit-list">
          {audit.map((a,i) => (
            <div key={i} className="audit-row">
              <span className={`badge ${a.act}`}></span>
              <span className="who"><b>{a.who}</b> {a.what} <b>{a.id}</b></span>
              <span className="when">{a.when}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

}

/* ============================== NOTICIAS ============================== */

function NewsBody({ toast, initialMode="Noticias económicas", onSubChange }) {
  const modes = ["Noticias económicas", "Noticias del Club", "Portal de empleos"];
  const [mode, setMode] = useState(initialMode);
  useEffect(()=>setMode(initialMode), [initialMode]);
  const [jobs, setJobs] = useState(JOBS_INIT);
  const [showJob, setShowJob] = useState(false);
  const [job, setJob] = useState({company:"", role:"", area:"", contact:"empleos@clubeconomistasrd.org", phone:"+1 809 000 0000"});
  const publishJob = () => {
    setJobs(j => [{...job, company:job.company || "Empresa aliada", role:job.role || "Nueva oportunidad laboral", area:job.area || "Economía"}, ...j]);
    setShowJob(false);
    toast("Oferta enviada al portal de empleos");
  };
  const list = mode === "Noticias del Club" ? CLUB_NEWS : NEWS;
  return (
    <div>
      <div className="subview-banner">
        <div><span>Canal activo</span><h3>{mode}</h3></div>
        <p>{mode === "Portal de empleos" ? "Oportunidades laborales curadas para estudiantes y economistas." : "Actualidad organizada por canal editorial."}</p>
      </div>
      <div className="institution-strip">
        {modes.map(m => <button key={m} className={`institution-pill ${m===mode?"on":""}`} onClick={()=>{setMode(m); onSubChange && onSubChange(m);}}>{m}</button>)}
      </div>
      {mode === "Portal de empleos" ? (
        <div className="jobs-panel">
          <div className="jobs-head"><h3>Portal de empleos</h3><button className="btn btn-primary" onClick={()=>setShowJob(true)}>Subir oferta {Ico.arr()}</button></div>
          <p className="job-contact">Para enviar oportunidades: <b>empleos@clubeconomistasrd.org</b> · <b>+1 809 000 0000</b></p>
          {showJob && <div className="job-form"><input placeholder="Empresa" value={job.company} onChange={e=>setJob({...job, company:e.target.value})}/><input placeholder="Puesto" value={job.role} onChange={e=>setJob({...job, role:e.target.value})}/><input placeholder="Área" value={job.area} onChange={e=>setJob({...job, area:e.target.value})}/><button className="chip" onClick={publishJob}>Enviar oferta al equipo</button></div>}
          <div className="job-grid">{jobs.map((j,i)=><article key={i} className="job-card"><span>{j.area}</span><h4>{j.role}</h4><p>{j.company}</p><div>{j.contact} · {j.phone}</div></article>)}</div>
        </div>
      ) : (
        <div className="news-grid">
          {list.map((n,i) => (
            <a key={i} href="#" className="news-item" onClick={(e)=>{e.preventDefault();toast("Redirigiendo a "+n.src);}}>
              <div className="news-src"><span className="pip"></span> {n.src}</div>
              <h4>{n.t}</h4>
              <div className="news-time">{Ico.clock()} {n.time}</div>
            </a>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================== APP ============================== */
function App() {
  const [active, setActive] = useState("inicio");
  const [subview, setSubview] = useState({ estadisticas:"BCRD", blog:"Blogstop", noticias:"Noticias económicas", club:"Fundadores" });
  const [logged, setLogged] = useState(false);
  const [queue, setQueue] = useState(QUEUE_INIT);
  const [audit, setAudit] = useState(AUDIT_INIT);
  const [toastMsg, setToastMsg] = useState(null);
  const tRef = useRef(null);
  const toast = (msg) => { setToastMsg(msg); if (tRef.current) clearTimeout(tRef.current); tRef.current = setTimeout(()=>setToastMsg(null), 2600); };
  const go = (id, sub=null) => {
    if (sub) setSubview(prev => ({ ...prev, [id]: sub }));
    setActive(id);
    window.requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: "smooth" }));
  };
  const setSub = (id, sub) => setSubview(prev => ({ ...prev, [id]: sub }));

  const addSubmission = (item) => {
    setQueue(q => [item, ...q]);
    setAudit(a => [{ act:"a", who:"Sistema", what:"recibió", id:item.id, when:"Ahora" }, ...a]);
  };

  const renderView = () => {
    if (active === "inicio") {
      return (
        <React.Fragment>
          <Hero go={go} />
          <SectionMenu go={go} />
        </React.Fragment>
      );
    }
    if (active === "estadisticas") return <SectionView view="estadisticas"><StatsBody toast={toast} initialInstitution={subview.estadisticas} onSubChange={(sub)=>setSub("estadisticas", sub)} /></SectionView>;
    if (active === "investigacion") return <SectionView view="investigacion"><ResearchBody toast={toast} onSubmit={addSubmission} /></SectionView>;
    if (active === "blog") return <SectionView view="blog"><BlogBody toast={toast} onSubmit={addSubmission} initialMode={subview.blog} onSubChange={(sub)=>setSub("blog", sub)} /></SectionView>;
    if (active === "formacion") return <SectionView view="formacion"><FormationBody /></SectionView>;
    if (active === "noticias") return <SectionView view="noticias"><NewsBody toast={toast} initialMode={subview.noticias} onSubChange={(sub)=>setSub("noticias", sub)} /></SectionView>;
    if (active === "club") return <SectionView view="club"><ClubBody initialSection={subview.club} onSubChange={(sub)=>setSub("club", sub)} /></SectionView>;
    if (active === "admin") return <SectionView view="admin">{logged ? <AdminBody toast={toast} queue={queue} setQueue={setQueue} audit={audit} setAudit={setAudit} /> : <AdminGate onLogin={()=>{setLogged(true); toast("Sesión admin iniciada");}} />}</SectionView>;
    return null;
  };

  return (
    <React.Fragment>
      <Nav active={active} go={go} subview={subview} />
      <main>{renderView()}</main>
      <Footer go={go} />
      {toastMsg && (<div className="toast-wrap"><div className="toast"><span className="ok">✓</span> {toastMsg}</div></div>)}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
